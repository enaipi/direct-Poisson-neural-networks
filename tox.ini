[tox]
envlist = py38,py39,py310,py311,lint,type

[testenv]
description = Run unit tests with pytest
deps = 
    pytest>=6.0
    pytest-cov
    torch>=1.9.0
    numpy>=1.19.0
    scipy>=1.5.0
extras = dev
commands = pytest {posargs:tests/}

[testenv:lint]
description = Run code quality checks
skip_install = True
deps = 
    flake8
    black
commands = 
    black --check src/ tests/
    flake8 src/ tests/

[testenv:type]
description = Run type checking with mypy
skip_install = True
deps = 
    mypy
    torch
commands = mypy src/dpnn/models/

[testenv:coverage]
description = Generate coverage report
deps = 
    {[testenv]deps}
commands = 
    pytest --cov=src/dpnn/models --cov-report=html --cov-report=term-missing tests/

[testenv:docs]
description = Build documentation
skip_install = True
deps = 
    sphinx
    sphinx-rtd-theme
commands = 
    sphinx-build -W -b html -d {envtmpdir}/doctrees doc {envtmpdir}/html
